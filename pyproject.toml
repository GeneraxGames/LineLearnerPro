[project]
name = "linelearnerpro"
version = "1.2.0"
description = "LineLearnerPro - line rehearsal tool"
requires-python = ">=3.12"
dependencies = [
    "flet==0.86.0",
    "flet-desktop==0.86.0",
    "flet-audio==0.86.0",
    "Pillow",
    "piper-tts",
    "vosk",
    "sounddevice",
]

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"

[tool.flet]
product = "LineLearnerPro"
